name: TrashPanda unified QA offline tests (release hold)

on:
  workflow_dispatch:
  push:
    branches:
      - qa/tpt-integration-20261103
    paths:
      - '.github/workflows/tpt-qa-staging.yml'
      - 'qa-integration/**'
      - 'project-handoffs/archive-recovery/**'
      - 'development-snapshots/B38/**'

permissions:
  contents: read

jobs:
  unified-candidate-offline-tests:
    name: Verify archives and test imported unified source on JDK17
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Checkout QA branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify preserved historical archives
        shell: pwsh
        run: |
          & .\qa-integration\00-PREPARE-QA-SOURCES.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run actual unified QA candidate unit tests
        shell: pwsh
        run: |
          Set-Location .\qa-integration\generated\unified-qa-candidate\Project-Burrow
          & .\gradlew.bat --no-daemon clean test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preserve unified candidate test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tpt-unified-qa-offline-evidence
          path: |
            qa-integration/generated/unified-qa-candidate/Project-Burrow/build/reports/tests/
            qa-integration/generated/unified-qa-candidate/Project-Burrow/build/test-results/
          if-no-files-found: ignore
          retention-days: 14

# Unit tests are not live RuneLite QA, owner acceptance, or release authorization.
