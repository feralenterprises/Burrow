name: TrashPanda QA source staging (release hold)

on:
  workflow_dispatch:
  push:
    branches:
      - qa/tpt-integration-20261103
    paths:
      - '.github/workflows/tpt-qa-staging.yml'
      - 'qa-integration/**'
      - 'project-handoffs/archive-recovery/**'
      - 'development-snapshots/B38/**'

permissions:
  contents: read

jobs:
  isolated-w09-offline-tests:
    name: Verify SHA-pinned inputs and test isolated W09 under JDK17
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Checkout QA branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Restore and verify source ZIPs
        shell: pwsh
        run: |
          & .\qa-integration\00-PREPARE-QA-SOURCES.ps1
      - name: Run exact isolated W09 source unit tests
        shell: pwsh
        run: |
          Set-Location .\qa-integration\generated\pathfinder-w09\Project-Burrow
          & .\gradlew.bat --no-daemon test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preserve bounded offline test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tpt-qa-w09-offline-evidence
          path: |
            qa-integration/generated/pathfinder-w09/Project-Burrow/build/reports/tests/
            qa-integration/generated/pathfinder-w09/Project-Burrow/build/test-results/
          if-no-files-found: ignore
          retention-days: 14

# NO RuneLite live gameplay, owner acceptance, Plugin Hub release or automatic main merge.
